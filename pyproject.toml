[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyastack"
version = "0.1.1"
description = "A thread-safe, atomic stack implementation supporting both strings and lists uniformly."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Ibusa-T", email = "souichirou199513@gmail.com" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "build>=1.6.1",
    "twine>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Ibusa-T/Pyastack"
Repository = "https://github.com/Ibusa-T/Pyastack"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
]

